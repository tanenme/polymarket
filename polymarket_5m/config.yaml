project:
  name: polymarket_btc_15m
  symbol: BTCUSDT
  round_minutes: 15
  target_threshold: 0.002
  version: v1
paths:
  data:
    raw: data/raw
    orderbook: data/raw/orderbook
    aggtrades: data/raw/aggtrades
    klines_1m: data/raw/historical_1m_klines.parquet
    oi: data/raw/oi
    liquidations: data/raw/liquidations
    interim: data/interim
    features_v1: data/features/v1
    labels: data/labels
  models:
    artifacts: models/artifacts
    checkpoints: models/checkpoints
  logs: logs
  reports: reports
data:
  ob_depth: 20
  pre_round_window_mins: 15
  max_gap_seconds: 180
  min_ticks_per_round: 10
  resample_interval_seconds: 10
  coverage_warning_threshold: 0.7
  data_start: '2025-04-29'
  data_end: '2026-04-30'
features:
  time_like_cols:
  - sin_hour
  - cos_hour
  - sin_dow
  - cos_dow
  - sin_15m
  - cos_15m
  - is_us_session
  - is_london_session
  - is_overlap
  - is_weekend
  - is_roll_hour
  - minutes_since_roll
  price_absolute_cols:
  - price
  - close
  - open
  - high
  - low
  - initial_price
  - final_price
  exclude_cols:
  - round_start
  - target
  - future_return
  - tick_count
  - max_gap
  - gap_to_prev
  - has_valid_context
  - round_label
  - label_source
  - label_threshold
  - label_version
  - volume_sum
  - initial_price
  - final_price
  - past_
  target_n_features: 70
  nan_threshold: 0.3
  std_threshold: 1.0e-10
  inter_round_lags: 8
  inter_round_rolling:
  - 4
  - 8
  - 16
training:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  sample_weight_high: 1.0
  sample_weight_low: 1.0
  wfv_train_rounds: 1344
  wfv_val_rounds: 192
  wfv_step_rounds: 192
  wfv_n_splits: 6
  catboost:
    task_type: GPU
    devices: '0'
    gpu_ram_part: 0.4
    max_bin: 128
    bootstrap_type: Bernoulli
    loss_function: Logloss
    eval_metric: AUC
    random_seed: 42
    optuna_search_space:
      depth:
      - 4
      - 6
      l2_leaf_reg:
      - 30.0
      - 300.0
      random_strength:
      - 1.0
      - 20.0
      min_data_in_leaf:
      - 300
      - 1500
      learning_rate:
      - 0.008
      - 0.04
      max_bin:
      - 64
      - 128
      subsample:
      - 0.5
      - 0.85
    iterations_per_trial: 2000
    early_stopping_per_trial: 100
    iterations_final: 1000
    early_stopping_final: 200
    snapshot_interval: 300
  lightgbm_screener:
    n_estimators: 500
    num_leaves: 31
    learning_rate: 0.05
    feature_fraction: 0.7
    bagging_fraction: 0.8
    bagging_freq: 5
    min_child_samples: 30
    boosting_type: gbdt
    reg_alpha: 0.1
    reg_lambda: 0.1
    n_jobs: 10
    verbose: -1
    random_state: 42
    early_stopping_rounds: 50
  lightgbm_final:
    boosting_type: gbdt
    objective: binary
    metric: auc
    num_leaves: 63
    learning_rate: 0.02
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 5
    min_child_samples: 50
    reg_alpha: 0.1
    reg_lambda: 0.5
    n_jobs: 10
    verbose: -1
    seed: 42
    num_boost_round: 2000
    early_stopping_rounds: 100
  optuna:
    n_trials: 25
    direction: maximize
    sampler: TPE
    seed: 42
    overfit_gap_allowed: 0.02
    prob_spread_bonus_weight: 5.0
    prob_spread_max_bonus: 0.03
evaluation:
  threshold_scan_start: 0.5
  threshold_scan_end: 0.7
  threshold_scan_step: 0.005
  min_coverage_for_threshold: 0.1
  confidence_levels:
  - 0.5
  - 0.51
  - 0.53
  - 0.55
  - 0.57
  - 0.6
  calibration_method: isotonic
  calibration_n_bins: 10
  sessions:
    us:
    - 13
    - 21
    london:
    - 7
    - 16
    asian:
    - 0
    - 8
    overlap:
    - 13
    - 16
  rvol_low_pct: 0.25
  rvol_high_pct: 0.75
trade_decision:
  initial_bankroll: 100.0
  polymarket_fee: 0.02
  model_risk_margin: 0.02
  min_ev_to_trade: 0.0
  max_bet_fraction: 0.05
  kelly_fraction: 0.25
  max_loss_24h_pct: 0.1
  max_consecutive_losses: 10
  max_polymarket_spread: 0.05
  min_polymarket_depth: 10.0
monitoring:
  calibration_drift_threshold: 0.05
  feature_drift_ks_pvalue: 0.05
  performance_decay_threshold: 0.03
